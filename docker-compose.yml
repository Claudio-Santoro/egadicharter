services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    profiles: ["dev"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FORM_ENDPOINT: ${VITE_FORM_ENDPOINT:-}
    ports:
      - "8080:80"
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    profiles: ["prod-tls"]

volumes:
  node_modules:
  caddy_data:
  caddy_config:
