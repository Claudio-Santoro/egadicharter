# HTML sempre rivalidato, il resto con la cache di default (gli asset in /assets/ sono immutabili)
map $sent_http_content_type $cache_html {
    ~text/html "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_html;

    # pagine prerenderizzate: /en/contatti → en/contatti.html; il resto è un 404 vero
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # gli URL canonici non hanno la barra finale: /en/ → /en
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
